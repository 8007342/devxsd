name: devxsd_gamejam
description: DEVxSD GameJam Flutter and Flame starter.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/NotoSans.ttf
